<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務單位目錄 | Directory</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- PapaParse for CSV reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-xl font-bold tracking-wide">📂 服務單位資訊網</span>
            <span id="recordCount" class="text-xs bg-blue-800 px-3 py-1.5 rounded-full font-medium">載入中...</span>
        </div>
    </nav>

    <!-- Header Banner & Search -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white py-12 px-6 text-center shadow-inner">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-3xl font-extrabold mb-3">服務單位一覽表</h1>
            <p class="text-blue-200 mb-6 text-sm">輸入關鍵字即可即時篩選機構、地址、電話或負責人資料</p>
            
            <div class="relative max-w-xl mx-auto">
                <input type="text" id="searchInput" placeholder="搜尋單位、地區、電話、負責人..." 
                    class="w-full px-5 py-3.5 rounded-xl text-gray-800 bg-white focus:outline-none focus:ring-4 focus:ring-blue-300 shadow-lg text-base">
            </div>
        </div>
    </header>

    <!-- Main Content Grid / Table Section -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-100 text-gray-700 font-bold uppercase tracking-wider text-xs">
                        <tr>
                            <th class="px-6 py-4 text-left">資金來源 / 地區</th>
                            <th class="px-6 py-4 text-left">服務 / 單位名稱</th>
                            <th class="px-6 py-4 text-left">地址</th>
                            <th class="px-6 py-4 text-left">聯絡電話 / 電郵</th>
                            <th class="px-6 py-4 text-left">負責人</th>
                            <th class="px-6 py-4 text-left">備註 / 年齡</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white" id="tableBody">
                        <!-- Dynamic rows loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-6 text-center text-xs">
        <p>&copy; 2026 服務單位目錄. All rights reserved.</p>
    </footer>

    <script>
        let tableData = [];

        Papa.parse("directory.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                tableData = results.data;
                renderTable(tableData);
            }
        });

        function renderTable(data) {
            const bodyElement = document.getElementById("tableBody");
            const countElement = document.getElementById("recordCount");
            bodyElement.innerHTML = "";
            countElement.textContent = `共 ${data.length} 筆記錄`;

            if (data.length === 0) {
                bodyElement.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-400">沒有找到相符的資料</td></tr>`;
                return;
            }

            data.forEach(row => {
                // Map columns safely based on your exact column names in directory.csv
                const source = row['資金來源'] || '';
                const region = row['地區'] || '';
                const serviceUnit = row['組別 / 單位'] || row['單位類別'] || '';
                const address = row['地址'] || '';
                const phone = row['電話 (Fax no.)'] || '';
                const email = row['電郵'] || '';
                const charge = row['主任 / 負責人'] || '';
                const remark = row['備註'] || row['服務年齡/面積 (平方米)'] || '';

                let tr = `<tr class='hover:bg-blue-50/50 transition-colors align-top'>`;
                
                // Col 1: Source & Region
                tr += `<td class="px-6 py-4 whitespace-nowrap">
                         <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-md font-semibold mb-1">${source}</span><br>
                         <span class="text-gray-500 text-xs">${region}</span>
                       </td>`;
                
                // Col 2: Service / Unit Name
                tr += `<td class="px-6 py-4 font-medium text-gray-900">
                         <div class="text-sm font-bold text-blue-900">${row['單位類別'] || ''}</div>
                         <div class="text-gray-700 mt-0.5">${serviceUnit.replace(/\n/g, '<br>')}</div>
                       </td>`;

                // Col 3: Address
                tr += `<td class="px-6 py-4 text-gray-600 text-xs max-w-xs leading-relaxed">${address.replace(/\n/g, '<br>')}</td>`;

                // Col 4: Phone & Email
                tr += `<td class="px-6 py-4 text-xs">
                         <div class="text-gray-900 font-semibold">${phone.replace(/\n/g, '<br>')}</div>
                         <div class="text-blue-600 mt-1"><a href="mailto:${email}" class="hover:underline">${email}</a></div>
                       </td>`;

                // Col 5: Person in charge
                tr += `<td class="px-6 py-4 text-xs text-gray-700 font-medium">${charge.replace(/\n/g, '<br>')}</td>`;

                // Col 6: Remarks / Age
                tr += `<td class="px-6 py-4 text-xs text-gray-500">${remark.replace(/\n/g, '<br>')}</td>`;

                tr += `</tr>`;
                bodyElement.innerHTML += tr;
            });
        }

        // Search Filter
        document.getElementById("searchInput").addEventListener("input", function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredData = tableData.filter(row => {
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(searchTerm)
                );
            });
            renderTable(filteredData);
        });
    </script>
</body>
</html>
