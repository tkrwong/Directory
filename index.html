<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務單位目錄 | Directory Home</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- PapaParse for easy CSV reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold">📂 服務單位資訊網</span>
            </div>
            <div>
                <a href="#directory" class="text-sm bg-blue-800 hover:bg-blue-700 px-4 py-2 rounded-lg transition">瀏覽目錄</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section (Home Banner) -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white py-16 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-4xl font-extrabold mb-4 tracking-tight">尋找您需要的服務單位</h1>
            <p class="text-lg text-blue-100 mb-8">快速搜尋各服務單位的地址、電話、負責人及相關備註資料。</p>
            
            <!-- Quick Search in Hero -->
            <div class="relative max-w-xl mx-auto">
                <input type="text" id="heroSearchInput" placeholder="輸入關鍵字（例如：銅鑼灣、電話、組別...）" 
                    class="w-full px-5 py-4 rounded-full text-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300 shadow-lg text-base">
            </div>
        </div>
    </header>

    <!-- Main Content / Directory Section -->
    <main id="directory" class="flex-grow max-w-7xl mx-auto px-4 py-12 w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">單位詳細一覽表</h2>
            <span id="recordCount" class="text-sm text-gray-500 bg-white px-3 py-1 rounded-full border border-gray-200">載入中...</span>
        </div>

        <!-- Table Container -->
        <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table id="directoryTable" class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50 text-gray-700 font-semibold" id="tableHeader">
                        <!-- Headers load dynamically -->
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white" id="tableBody">
                        <!-- Data loads dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-6 text-center text-sm">
        <p>&copy; 2026 服務單位目錄. All rights reserved.</p>
    </footer>

    <!-- Script to Load CSV and Enable Sync Search -->
    <script>
        let tableData = [];

        Papa.parse("directory.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                tableData = results.data;
                renderTable(tableData);
            }
        });

        function renderTable(data) {
            const headerElement = document.getElementById("tableHeader");
            const bodyElement = document.getElementById("tableBody");
            const countElement = document.getElementById("recordCount");

            headerElement.innerHTML = "";
            bodyElement.innerHTML = "";
            countElement.textContent = `共 ${data.length} 筆記錄`;

            if (data.length === 0) {
                bodyElement.innerHTML = `<tr><td colspan="10" class="px-6 py-8 text-center text-gray-500">沒有找到相符的資料</td></tr>`;
                return;
            }

            const columns = Object.keys(data[0]);
            let headerRow = "<tr>";
            columns.forEach(col => {
                headerRow += `<th class="px-6 py-4 text-left uppercase tracking-wider text-xs">${col}</th>`;
            });
            headerRow += "</tr>";
            headerElement.innerHTML = headerRow;

            data.forEach(row => {
                let tr = "<tr class='hover:bg-blue-50/50 transition-colors'>";
                columns.forEach(col => {
                    let cellValue = row[col] || "";
                    cellValue = cellValue.replace(/\n/g, '<br>');
                    tr += `<td class="px-6 py-4 whitespace-normal text-gray-700">${cellValue}</td>`;
                });
                tr += "</tr>";
                bodyElement.innerHTML += tr;
            });
        }

        // Live Search Syncing
        document.getElementById("heroSearchInput").addEventListener("input", function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredData = tableData.filter(row => {
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(searchTerm)
                );
            });
            renderTable(filteredData);
        });
    </script>
</body>
</html>
